syntax = "proto3";

package loboscontrol;
option go_package = "lobos/controlplane";

import "google/protobuf/wrappers.proto";

// ControlPlan implements the control plane for Lobos
service ControlPlane {

    // S3 User management
    // Add user adds an S3 user
    rpc AddUser (User) returns (UserReply) {}
    // ListAllUsers returns a list of all S3 users
    rpc ListAllUsers (Filters) returns (ListAllUsersReply) {}
    // RmUser removes an user
    rpc RmUser (RmUserParams) returns (google.protobuf.BoolValue) {}
    // AddKey adds a key to specified user
    rpc AddKey (User) returns (UserReply) {}
    // RmKey removes a key from a specified user
    rpc RmKey (User) returns (google.protobuf.BoolValue) {}
}

message RmUserParams {
    string name = 1;
    bool force = 2;
}

message User {
  string name = 1;
  string key = 2;
  string secret = 3;
  string backend = 4;
}

message Filters {
    string message = 1;
}

message ListAllUsersReply {
    repeated UserReply users = 1;
}

message UserReply {
    User user = 1;
}